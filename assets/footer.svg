<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Animated terminal session: whoami, ls ~/lanes, cat philosophy.txt, ./impact.sh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <clipPath id="c1"><rect x="62" y="58" width="0" height="24"><animate attributeName="width" values="0;0;58;58;0;0" keyTimes="0;0.021;0.063;0.95;0.96;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="62" y="108" width="0" height="24"><animate attributeName="width" values="0;0;97;97;0;0" keyTimes="0;0.161;0.203;0.95;0.96;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="62" y="158" width="0" height="24"><animate attributeName="width" values="0;0;173;173;0;0" keyTimes="0;0.301;0.371;0.95;0.96;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="62" y="208" width="0" height="24"><animate attributeName="width" values="0;0;106;106;0;0" keyTimes="0;0.441;0.49;0.95;0.96;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="900" height="340" rx="14" fill="url(#bg)"/>
  <rect width="900" height="34" rx="14" fill="#151f2b"/>
  <rect y="20" width="900" height="14" fill="#151f2b"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6b8299">mahith@hyderabad: ~</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <!-- row 1 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.021;0.0245;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="40" y="75" fill="#69f0ae">$</text>
      <g clip-path="url(#c1)"><text x="62" y="75" fill="#e6edf3" textLength="58" lengthAdjust="spacingAndGlyphs">whoami</text></g>
    </g>
    <text x="62" y="98" fill="#00e5ff" opacity="0" textLength="531" lengthAdjust="spacingAndGlyphs">Venkata Mahith Manne &#183; Software Engineer &#183; Hyderabad, India
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.07;0.077;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- row 2 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.161;0.1645;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="40" y="125" fill="#69f0ae">$</text>
      <g clip-path="url(#c2)"><text x="62" y="125" fill="#e6edf3" textLength="97" lengthAdjust="spacingAndGlyphs">ls ~/lanes</text></g>
    </g>
    <g font-weight="700" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.217;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="62" y="148" fill="#b388ff">ai/</text>
      <text x="116" y="148" fill="#ff4081">security/</text>
      <text x="224" y="148" fill="#00e5ff">devops/</text>
      <text x="314" y="148" fill="#ffd740">backend/</text>
      <text x="413" y="148" fill="#ff9100">mobile/</text>
      <text x="503" y="148" fill="#69f0ae">desktop/</text>
    </g>

    <!-- row 3 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.301;0.3045;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="40" y="175" fill="#69f0ae">$</text>
      <g clip-path="url(#c3)"><text x="62" y="175" fill="#e6edf3" textLength="173" lengthAdjust="spacingAndGlyphs">cat philosophy.txt</text></g>
    </g>
    <text x="62" y="198" fill="#69f0ae" font-weight="700" opacity="0" textLength="360" lengthAdjust="spacingAndGlyphs">If a solution doesn't exist, I build it.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.378;0.385;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- row 4 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.441;0.4445;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="40" y="225" fill="#69f0ae">$</text>
      <g clip-path="url(#c4)"><text x="62" y="225" fill="#e6edf3" textLength="106" lengthAdjust="spacingAndGlyphs">./impact.sh</text></g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.497;0.504;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="62" y="248" fill="#69f0ae">Built api with 99.9% uptime</text>
      <text x="62" y="270" fill="#ffd740">CI/CD: a 1-day cycle run by 5 engineers now runs automatically in 15 min</text>
      <text x="62" y="292" fill="#ff9100">Releases: 10 min -&gt; under 60 s</text>
    </g>

    <!-- idle prompt -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.539;0.546;0.95;0.96;1" dur="20s" repeatCount="indefinite"/>
      <text x="40" y="324" fill="#69f0ae">$</text>
      <rect x="62" y="310" width="10" height="17" fill="#69f0ae">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
